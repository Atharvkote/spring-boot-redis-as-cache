services:
  postgres:
    image: postgres:16
    container_name: caching-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: caching_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: caching-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
